[project]
name = "siril-mosaic-stacker"
version = "1.4.0"
description = "Source-safe graphical mosaic stacking workflow for Siril"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil==7.0.0",
    "pysiril==0.0.15",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
